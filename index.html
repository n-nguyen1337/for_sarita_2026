<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Little World</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23ff5d8f' d='M50 89C20 66 5 48 5 30 5 16 16 6 29 6c9 0 17 5 21 13 4-8 12-13 21-13 13 0 24 10 24 24 0 18-15 36-45 59z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/ui.css" />
  </head>
  <body>
    <!-- The title screen, which doubles as the loading screen -->
    <div id="title" class="loading">
      <div id="title-hearts" aria-hidden="true"></div>
      <h1>Our Little World</h1>
      <p class="for">for Sarah</p>
      <svg class="loader" viewBox="0 0 100 100" role="progressbar" aria-label="Loading">
        <defs>
          <clipPath id="title-clip"><rect id="title-fill" x="0" y="100" width="100" height="0" /></clipPath>
        </defs>
        <path class="empty" d="M50 89C20 66 5 48 5 30 5 16 16 6 29 6c9 0 17 5 21 13 4-8 12-13 21-13 13 0 24 10 24 24 0 18-15 36-45 59z" />
        <path class="full" clip-path="url(#title-clip)" d="M50 89C20 66 5 48 5 30 5 16 16 6 29 6c9 0 17 5 21 13 4-8 12-13 21-13 13 0 24 10 24 24 0 18-15 36-45 59z" />
      </svg>
      <p class="begin">Press any key to begin</p>
    </div>

    <div id="zone-name" hidden></div>
    <!-- Comes after #zone-name: ui.css hides it while the zone's name is showing -->
    <div id="look-hint" hidden><kbd>Click</kbd> to look around</div>
    <div id="hint" hidden>
      <span><kbd>WASD</kbd> or <kbd>Arrows</kbd> walk</span>
      <span><kbd>Space</kbd> jump</span>
      <span><kbd>Mouse</kbd> look around</span>
      <span><kbd>E</kbd> read signs</span>
    </div>
    <div id="prompt" hidden><kbd>E</kbd>Read the sign</div>
    <div id="message" hidden>
      <div class="seal" aria-hidden="true"></div>
      <h2></h2>
      <div class="body"></div>
      <div class="close">E to close · or just walk away</div>
    </div>
    <button id="mute" type="button" aria-label="Mute sound (M)" title="Mute sound (M)" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="speaker" d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" />
        <path class="waves" d="M15 9a4 4 0 0 1 0 6M17.5 6.5a7.5 7.5 0 0 1 0 11" />
        <path class="slash" d="M15 9.5l5 5M20 9.5l-5 5" />
      </svg>
    </button>

    <!-- The heart that closes over the screen between zones. main.js drives it through ui.js -->
    <svg id="wipe" hidden aria-hidden="true">
      <defs>
        <mask id="wipe-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
          <rect width="100%" height="100%" fill="#fff" />
          <path id="wipe-heart" fill="#000" d="M50 89C20 66 5 48 5 30 5 16 16 6 29 6c9 0 17 5 21 13 4-8 12-13 21-13 13 0 24 10 24 24 0 18-15 36-45 59z" />
        </mask>
      </defs>
      <rect id="wipe-fill" width="100%" height="100%" mask="url(#wipe-mask)" />
    </svg>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
